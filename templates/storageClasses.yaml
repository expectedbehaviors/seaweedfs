{{- range .Values.storageClasses }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    {{- if .default }}
    storageclass.kubernetes.io/is-default-class: "true"
    {{- end }}
provisioner: {{ default "seaweedfs-csi-driver" .provisioner }}
reclaimPolicy: {{ default "Retain" .reclaimPolicy }}
allowVolumeExpansion: {{ default true .allowVolumeExpansion }}
volumeBindingMode: {{ default "Immediate" .volumeBindingMode }}
{{- if .mountOptions }}
mountOptions:
  {{- toYaml .mountOptions | nindent 2 }}
{{- end }}
parameters:
  collection: {{ default "default" .collection | quote }}
  replication: {{ default "001" .replication | quote }}
{{- end }}
